; PlatformIO build file. (Arduino IDE users: just open
; NeoPixelPainterESP32/NeoPixelPainterESP32.ino instead.)
; Uses the pioarduino platform for Arduino-ESP32 core 3.x.

[platformio]
src_dir = NeoPixelPainterESP32
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

[env:esp32dev]
board = esp32dev

; WROVER / PSRAM boards (e.g. ESP32-WROVER-KIT): long images play from PSRAM
[env:esp32-wrover]
board = esp-wrover-kit

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-s2]
board = esp32-s2-saola-1

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:esp32-c6]
board = esp32-c6-devkitc-1
